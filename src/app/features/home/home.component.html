<section class="hero">
  <div>
    <p class="eyebrow">Find your next home</p>
    <h1>Discover comfortable housing options near you</h1>
    <p class="hero-text">
      Search by city and explore available housing with clear details.
    </p>
  </div>
</section>

<section class="search-card">
  <input type="text" placeholder="Search by city..." #filter />

  <button type="button" (click)="filterResults(filter.value)">
    Search
  </button>
</section>

<section class="results">
  @for (housingLocation of filteredLocationList; track housingLocation.id) {
    <app-housing-card
      [housingLocation]="housingLocation">
    </app-housing-card>
  } @empty {
    <p class="empty-message">No housing found for this city.</p>
  }
</section>
